name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Run regression suite
        run: python -m unittest discover -s tests -v

  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify wheel contents
        run: |
          python - <<'PY'
          import glob
          import zipfile
          wheel = glob.glob('dist/*.whl')[0]
          with zipfile.ZipFile(wheel) as archive:
              assert not any(name.startswith('tests/') for name in archive.namelist())
          PY

      - name: Install built wheel
        run: python -m pip install dist/*.whl

      - name: Verify installed API and CLI
        run: |
          python -c "from audio_desilencer import AudioProcessor, ProcessingResult, build_removal_ranges, complement_ranges; assert build_removal_ranges(1000, [(100, 900)], 200) == [(200, 800)]; assert complement_ranges(10, [(2, 8)]) == [(0, 2), (8, 10)]"
          audio-desilencer --help
